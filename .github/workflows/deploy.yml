name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx wrangler d1 migrations apply nhadepchat-db --remote --config wrangler.jsonc
      - run: npm run deploy
      - name: Configure Worker secrets
        shell: bash
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          printf '%s' "$BETTER_AUTH_SECRET" | npx wrangler secret put BETTER_AUTH_SECRET --config dist/server/wrangler.json
          printf '%s' "$ADMIN_EMAILS" | npx wrangler secret put ADMIN_EMAILS --config dist/server/wrangler.json
          if [ -n "$BETTER_AUTH_URL" ]; then
            printf '%s' "$BETTER_AUTH_URL" | npx wrangler secret put BETTER_AUTH_URL --config dist/server/wrangler.json
          fi
