name: Deploy Pages website and backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_MEDIA_URL: ${{ vars.NEXT_PUBLIC_MEDIA_URL }}
    steps:
      - name: Validate production configuration
        shell: bash
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_PUBLIC_BUCKET: ${{ secrets.R2_PUBLIC_BUCKET }}
          R2_PRIVATE_BUCKET: ${{ secrets.R2_PRIVATE_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
          NEXT_PUBLIC_MEDIA_URL: ${{ vars.NEXT_PUBLIC_MEDIA_URL }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BETTER_AUTH_SECRET BETTER_AUTH_URL GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET R2_ACCOUNT_ID R2_PUBLIC_BUCKET R2_PRIVATE_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY PAYMENT_WEBHOOK_SECRET NEXT_PUBLIC_MEDIA_URL; do
            if [ -z "${!name}" ]; then
              echo "Missing production secret: $name" >&2
              exit 1
            fi
          done
          if [ "$BETTER_AUTH_URL" != 'https://nhadepchat.tranvukim-tvk.workers.dev' ]; then
            echo 'Production auth origin is incorrect.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test scripts/*.test.mjs
      - run: npm run build
      - run: npx wrangler d1 migrations apply nhadepchat-db --remote --config wrangler.jsonc
      - run: npm run deploy
      - name: Configure Worker secrets
        shell: bash
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_PUBLIC_BUCKET: ${{ secrets.R2_PUBLIC_BUCKET }}
          R2_PRIVATE_BUCKET: ${{ secrets.R2_PRIVATE_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
        run: |
          printf '%s' "$BETTER_AUTH_SECRET" | npx wrangler secret put BETTER_AUTH_SECRET --config dist/server/wrangler.json
          printf '%s' "$ADMIN_EMAILS" | npx wrangler secret put ADMIN_EMAILS --config dist/server/wrangler.json
          if [ -n "$BETTER_AUTH_URL" ]; then
            printf '%s' "$BETTER_AUTH_URL" | npx wrangler secret put BETTER_AUTH_URL --config dist/server/wrangler.json
          fi
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            printf '%s' "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID --config dist/server/wrangler.json
            printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET --config dist/server/wrangler.json
          else
            echo 'Missing Google OAuth production secrets.' >&2
            exit 1
          fi
          printf '%s' "$R2_ACCOUNT_ID" | npx wrangler secret put R2_ACCOUNT_ID --config dist/server/wrangler.json
          printf '%s' "$R2_PUBLIC_BUCKET" | npx wrangler secret put R2_PUBLIC_BUCKET --config dist/server/wrangler.json
          printf '%s' "$R2_PRIVATE_BUCKET" | npx wrangler secret put R2_PRIVATE_BUCKET --config dist/server/wrangler.json
          printf '%s' "$R2_ACCESS_KEY_ID" | npx wrangler secret put R2_ACCESS_KEY_ID --config dist/server/wrangler.json
          printf '%s' "$R2_SECRET_ACCESS_KEY" | npx wrangler secret put R2_SECRET_ACCESS_KEY --config dist/server/wrangler.json
          printf '%s' "$PAYMENT_WEBHOOK_SECRET" | npx wrangler secret put PAYMENT_WEBHOOK_SECRET --config dist/server/wrangler.json
      - name: Build static Pages website and public images
        run: npm run build:pages
      - name: Deploy Pages website
        run: npm run deploy:pages
